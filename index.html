<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" value="0" readonly>

        <div class="buttons">
            <button class="function buttonbig" onclick="clearDisplay()">C</button>
            <button class="function">+/-</button>
            <button class="operator" onclick="appenValue('/')">/</button>

            <button class="number" onclick="appenValue('7')">7</button>
            <button class="number" onclick="appenValue('8')">8</button>
            <button class="number" onclick="appenValue('9')">9</button>
            <button class="operator" onclick="appenValue('*')">*</button>

            <button class="number" onclick="appenValue('4')">4</button>
            <button class="number" onclick="appenValue('5')">5</button>
            <button class="number" onclick="appenValue('6')">6</button>
            <button class="operator" onclick="appenValue('-')">-</button>

            <button class="number" onclick="appenValue('1')">1</button>
            <button class="number" onclick="appenValue('2')">2</button>
            <button class="number" onclick="appenValue('3')">3</button>
            <button class="operator" onclick="appenValue('+')">+</button>

            <button class="number" onclick="appenValue('0')">0</button>
            <button class="number" onclick="appenValue('.')">.</button>
            <button class="operator buttonbig" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
